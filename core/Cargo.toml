[package]
name = "tpt-fonts-core"
description = "Font engine, OS backends and session manager for tpt-fonts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1.8.7"
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
trash = "5"
ttf-parser = "0.25.1"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"
