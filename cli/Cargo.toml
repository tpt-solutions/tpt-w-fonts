[package]
name = "tpt-fonts-cli"
description = "Scriptable command-line interface for tpt-fonts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "tpt-fonts"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
tpt-fonts-core = { path = "../core" }

[dev-dependencies]
tempfile = "3.27.0"
