[package]
name = "tpt-fonts-tray"
description = "Resident tray process that holds session font activations alive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "tpt-fonts-tray"
path = "src/main.rs"

[dependencies]
interprocess = "2.4.7"
serde_json = "1.0.154"
tpt-fonts-core = { path = "../core" }
tray-icon = "0.24.2"
winit = "0.30.13"

[dev-dependencies]
tempfile = "3.27.0"
